# Self-hosting conformance manifest — content-presence guard for THIS repo.
#
# This repo is self-hosting: formal docs live at the root (SKILL.md,
# WORKFLOW.md, TEMPLATES-GUIDE.md, references/*) instead of under
# skills/<name>/workflows/. The downstream-facing manifest lives at
# `templates/skill/conformance.yaml` and assumes the standard layout, so it
# cannot validate this repo's own canonical content.
#
# This file fills that gap: assert that the upstream still teaches the
# protocols, gates, and principles its own templates promise. If a refactor
# accidentally drops "Task Closure Protocol" from TEMPLATES-GUIDE.md or
# "Progressive Rigor" from SKILL.md, the next `scripts/check-all.sh` run fails.
#
# Validate with:
#   bash templates/skill/scripts/check-version-conformance.sh . \
#     --conformance references/self-hosting-conformance.yaml
#
# Bumping rule: when you add a new mandatory protocol/principle phrase to
# `templates/skill/conformance.yaml`, mirror it here against whichever
# self-hosting file teaches the same thing. Otherwise upstream can quietly
# stop teaching what the templates require downstream to carry.

required_sections:
  - file: README.md
    must_contain:
      - "SBA is a Skill, not an agent operating system, task database, or execution runtime"
      - "derives an evidence-selected `direct`, `folder`, or `broad` result"
      - "does not expose a tier/profile/capability/install-mode switch"
      - "source-to-destination semantic evidence"
      - "fitted checks that the materializer emitted"
      - "Sub-agents are optional accelerators, not a setup requirement"
      - "continues the same bounded work inline"
      - "Correctness and completion never depend on sub-agent availability"
      - "changes the execution mode, not the requested result"
      - "Structural checks do not prove that every previous instruction survived semantically"
      - "a pushed branch is not an MR or PR"
      - "governing Requirement as projected into the Task Anchor"
      - "cannot add or alter the artifact or terminal state"
    must_not_contain:
      - "Codex is the exception"
      - "you have to authorize it explicitly"
      - "silently skip the delegation step"
      - "planned evidence-driven materializer remains roadmap work"
      - "not a shipped capability"
      - "Task Anchor, and governing Plan"

  - file: README.zh-CN.md
    must_contain:
      - "SBA 是一个 Skill，不是 Agent 操作系统、任务数据库或执行 runtime"
      - "按证据推导 `direct`、`folder` 或 `broad` 结果"
      - "不向用户暴露 tier/profile/capability/安装模式开关"
      - "source 到 destination 的语义证据"
      - "只运行 materializer 实际生成的 fitted checks"
      - "Sub-agent 是可选加速器，不是安装或正常使用的前置条件"
      - "正确性和完成标准不依赖 sub-agent 是否可用"
      - "inline 执行同一份有界工作"
      - "只会改变执行方式，不会改变请求结果"
      - "结构检查不能证明每一条旧规则都完成了语义迁移"
      - "已 push 的分支不等于 MR/PR"
      - "governing Requirement 绑定、并由 Task Anchor 投影"
      - "不得新增或修改交付物及终态"
    must_not_contain:
      - "Codex 是例外"
      - "都要**显式授权**"
      - "静默跳过委派步骤"
      - "仍是 roadmap 工作"
      - "不是已经交付的能力"
      - "Task Anchor 或 governing Plan"

  # SKILL.md teaches the activation contract — every principle below has a
  # downstream counterpart that propagates via templates/skill/SKILL.md.template.
  - file: SKILL.md
    must_contain:
      - "## Progressive Rigor"
      - "Routing.yaml as source"
      - "Activation over storage"
      - "every loaded file needs an independent task-time reason"
      - "Self-maintenance"
      - "Token efficiency"
      - "Task Execution + Closure"
      - "Present alignment proportionally"
      - "Anchor Checkpoint"

