# Upstream vendor catalog: allowed payloads are byte-identical mechanisms.
# Downstream sync-manifest.yaml is project-owned selection metadata: preserve
# its fitted subset, and adopt additional entries only through an explicit
# project decision. sync-vendor.sh uses this catalog only for legacy bootstrap
# when no local manifest exists, or to validate an existing selection.
# A selected path removed from the catalog is reported for manual review.
# Base = upstream at .upstream-sync synced_sha; a local payload matching base
# may update, while a differing local payload is reported and never overwritten.
# Allowed owners are protocol-blocks/** and scripts/**. sync-manifest.yaml is
# retained as bootstrap metadata, never overwritten when it already exists.
# All other paths are project-owned or generated and are not vendor payloads.
vendor:
  - sync-manifest.yaml
  - protocol-blocks/ambiguous-request-gate.md
  - protocol-blocks/composite-plan-execution.md
  - protocol-blocks/external-delivery-verification.md
  - protocol-blocks/plan-knowledge-closure.md
  - protocol-blocks/reboot-check.md
  - protocol-blocks/subagent-contract.md
  - protocol-blocks/user-decision-drift.md
  - protocol-blocks/workflow-distillation-proposal.md
  - scripts/audit-orphans.sh
  - scripts/check-version-conformance.sh
  - scripts/route-health.sh
  - scripts/route-reachability.sh
  - scripts/smoke-test.sh
  - scripts/sync-routing.sh
  - scripts/sync-vendor.sh
  - scripts/upstream-status.sh
