      - "without editing the Anchor"
      - "returns to Requirement Definition; only after the authoritative Requirement is"
      - "updated and reaches `requirement-ready` again"
      - "the result that would select the next read"
      - "Ranked, sampled, truncated, or Top-N output is candidate evidence, not an exhaustive inventory"
      - "## Workflow Boundary"
      - "## Recitation Loop"
      - "## Execution Loop"
      - "## New Message Gate"
      - "Already-clear wording stays verbatim"
      - "an Agent-derived summary cannot be the only normative record"
      - "## Exit To Closure"
      - "harness's native Plan/Task surface"
      - "do not repeat its steps in chat"
